# Weaver Forge configuration for the Go code generated from the go-sdk registry.
#
# Invoked as `weaver registry generate go <output>` from semconv/Makefile. The
# templates are derived from the ones opentelemetry-go uses for its semconv
# packages (Apache-2.0), trimmed to what a single-module package needs.
params:
  # Which module to generate: the metrics are the `metric.<module>.*` groups
  # of the registry, the attributes are the ones those metrics reference.
  # Passed per module from semconv/Makefile with -D module=... -D prefix=...
  module: watermill
  # Metric and attribute names that start with this prefix lose it in the Go
  # identifiers: watermill_messages_published_total -> MessagesPublishedTotal.
  prefix: watermill

templates:
  - pattern: metrics.go.j2
    filter: >
      semconv_metrics({"exclude_deprecated": true})
      | map(select(.id | startswith("metric." + $module + ".")))
    application_mode: single
    file_name: metrics.go
  - pattern: attributes.go.j2
    filter: >
      semconv_metrics({"exclude_deprecated": true})
      | map(select(.id | startswith("metric." + $module + ".")))
      | map(.attributes // []) | add // []
      | map(select(.deprecated | not))
      | unique_by(.name) | sort_by(.name)
    application_mode: single
    file_name: attributes.go

comment_formats:
  go:
    format: markdown
    prefix: "// "
    indent_first_level_list_items: true
    shortcut_reference_link: true
    trim: true
    word_wrap:
      line_length: 80
  go_1tab:
    format: markdown
    prefix: "\t// "
    indent_first_level_list_items: true
    shortcut_reference_link: true
    trim: true
    word_wrap:
      line_length: 80
default_comment_format: go

# Jinja whitespace: keep the newline that ends each template so gofmt is happy.
whitespace_control:
  trim_blocks: false
  lstrip_blocks: false
  keep_trailing_newline: true

# Words the `acronym` filter upper-cases in Go identifiers: span_id -> SpanID.
acronyms: ["ID", "URL", "HTTP", "GRPC", "DLQ", "WAL"]

text_maps:
  # Instrument overrides by metric name. The default is derived from the
  # registry's instrument and unit; list here the metrics that are observed
  # from a callback rather than recorded synchronously.
  instrument:
    postgres_replica_lag_bytes: Int64ObservableGauge
    postgres_replica_up: Int64ObservableGauge
  # Semantic convention attribute type -> attribute.Key method.
  attribute_type_method:
    string: String
    string[]: StringSlice
    int: Int
    int64: Int64
    int[]: IntSlice
    double: Float64
    double[]: FloatSlice
    boolean: Bool
    boolean[]: BoolSlice
  # Semantic convention attribute type -> Go value type.
  attribute_type_value:
    string: string
    string[]: "[]string"
    int: int
    int64: int64
    int[]: "[]int"
    double: float64
    double[]: "[]float64"
    boolean: bool
    boolean[]: "[]bool"
